name = "quiz-test-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "quiz-test-sync"
database_id = "71a23a42-201a-42ac-94c4-baba96eeaa2f"

# 每小時整點跑,檢查誰到提醒時間且今天還沒練
[triggers]
crons = ["0 * * * *"]

# 擋爬碼/濫用:同 IP 每 60 秒最多 60 次請求(整台 worker 共用一個桶,不分路徑)。
# 純 in-worker 比對,不存 IP、不需要 zone。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
VAPID_PUBLIC = "BB9u8wFjV8VQXm6hEQy-sLKc0PuQl3dPTJ68EPVoI_qmq_47hmO9swD0l03Cakcw0Rzeo0-fjhZY4E2WikV16uk"
ADMIN_CONTACT = "mailto:darronchao@gmail.com"
# 私鑰用 secret:wrangler secret put VAPID_PRIVATE
